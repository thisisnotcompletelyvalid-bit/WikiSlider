name: Bootstrap WikiSlider

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: wikislider-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Unpack finished project
        shell: bash
        run: |
          cat .bootstrap/chunk-*.txt | base64 --decode > /tmp/wikislider.tar.gz
          tar -xzf /tmp/wikislider.tar.gz -C .
          test -f package.json
          test -f scripts/crawl.py
          test -f src/App.tsx

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install crawler dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Test crawler and graph logic
        run: python -m unittest discover -s scripts/tests -v

      - name: Create initial Wikipedia sample
        run: >
          python scripts/crawl.py
          --seeds 350
          --popular 100
          --max-hops 75
          --delay 0.12
          --output public/data/graph.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Remove transfer scaffolding
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit finished application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build WikiSlider application"
          git push
