name: Bootstrap WikiSlider

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: wikislider-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack tested project
        shell: bash
        run: |
          cat .bootstrap/chunk-*.txt | base64 --decode > /tmp/wikislider.tar.gz
          echo "5ece334fa9759c20b4c5e0493390aa3fd6c2be12686520878830016784e04673  /tmp/wikislider.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wikislider.tar.gz -C .
          test -f app.js
          test -f scripts/crawl.py
          test -f public/data/graph.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install crawler dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Test crawler and graph logic
        run: python -m unittest discover -s scripts/tests -v

      - name: Check frontend syntax
        run: node --check app.js

      - name: Create initial live Wikipedia sample
        run: >
          python scripts/crawl.py
          --seeds 180
          --popular 40
          --max-depth 80
          --delay 0.36
          --output public/data/graph.json

      - name: Verify generated dataset
        shell: bash
        run: |
          python -m json.tool public/data/graph.json >/dev/null
          python - <<'PY'
          import json
          data=json.load(open('public/data/graph.json'))
          assert data['meta']['preview'] is False
          assert data['meta']['sampled_starts'] == 180
          assert data['nodes'] and data['edges']
          print(data['meta'])
          PY

      - name: Remove transfer scaffolding
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit finished application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build WikiSlider application"
          git push
